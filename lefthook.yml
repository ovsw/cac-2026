pre-commit:
  parallel: true
  jobs:
    - name: biome-fix
      glob: "*.{js,jsx,ts,tsx,cjs,mjs,cts,mts,json,jsonc,md,mdx,css,scss,yml,yaml}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    - name: quality
      run: pnpm run quality
